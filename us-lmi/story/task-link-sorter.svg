<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Three-lane sorter for posting-derived occupation-task links</title>
  <desc id="desc">A diagram sorting new occupation-task links into generic diffusion, possible missing core work, and cases needing review. Each lane shows five or more links.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-14%" width="116%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0a0d12" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f1eadf"/>
    </linearGradient>
    <linearGradient id="generic" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4f86bf"/>
      <stop offset="1" stop-color="#9fc2e5"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#cf4050"/>
      <stop offset="1" stop-color="#ef9b62"/>
    </linearGradient>
    <linearGradient id="review" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#806eb8"/>
      <stop offset="1" stop-color="#c7addf"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#paper)"/>
  <text x="80" y="74" fill="#151820" font-family="Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="850">New links need sorting.</text>
  <text x="80" y="116" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">A posting-derived task link can mean broad diffusion, possible missing core work, or a case that needs more review.</text>

  <g transform="translate(70 168)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="610" rx="18" fill="#ffffff" stroke="#d8d2c7"/>
    <rect x="0" y="0" width="400" height="14" rx="7" fill="url(#generic)"/>
    <text x="30" y="62" fill="#151820" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="850">Generic diffusion</text>
    <text x="30" y="98" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="19">A broad task appears everywhere.</text>

    <g transform="translate(36 138)">
      <circle cx="40" cy="145" r="13" fill="#4f86bf"/>
      <path d="M55 145 C115 48 225 40 322 58" fill="none" stroke="#4f86bf" stroke-width="8" stroke-linecap="round" opacity="0.88"/>
      <path d="M55 145 C125 83 225 78 326 102" fill="none" stroke="#4f86bf" stroke-width="8" stroke-linecap="round" opacity="0.76"/>
      <path d="M55 145 C126 127 235 131 330 145" fill="none" stroke="#4f86bf" stroke-width="8" stroke-linecap="round" opacity="0.64"/>
      <path d="M55 145 C124 176 228 182 326 194" fill="none" stroke="#4f86bf" stroke-width="8" stroke-linecap="round" opacity="0.52"/>
      <path d="M55 145 C112 225 224 244 318 244" fill="none" stroke="#4f86bf" stroke-width="8" stroke-linecap="round" opacity="0.40"/>
      <circle cx="328" cy="58" r="9" fill="#4f86bf"/>
      <circle cx="334" cy="102" r="9" fill="#4f86bf" opacity="0.9"/>
      <circle cx="338" cy="145" r="9" fill="#4f86bf" opacity="0.78"/>
      <circle cx="334" cy="194" r="9" fill="#4f86bf" opacity="0.66"/>
      <circle cx="326" cy="244" r="9" fill="#4f86bf" opacity="0.54"/>
      <text x="0" y="320" fill="#151820" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="800">Example</text>
      <text x="0" y="355" fill="#30343b" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Assign duties or work</text>
      <text x="0" y="386" fill="#30343b" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">schedules to employees.</text>
    </g>

    <text x="30" y="548" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Read as taxonomy breadth,</text>
    <text x="30" y="576" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">not a surprising occupation home.</text>
  </g>

  <g transform="translate(520 168)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="610" rx="18" fill="#ffffff" stroke="#d8d2c7"/>
    <rect x="0" y="0" width="400" height="14" rx="7" fill="url(#core)"/>
    <text x="30" y="62" fill="#151820" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="850">Possible missing core</text>
    <text x="30" y="98" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="19">Domain work appears off-list.</text>

    <g transform="translate(36 138)">
      <circle cx="42" cy="145" r="14" fill="#cf4050"/>
      <path d="M58 145 C126 42 232 34 324 58" fill="none" stroke="#cf4050" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
      <path d="M58 145 C137 78 237 82 326 104" fill="none" stroke="#cf4050" stroke-width="9" stroke-linecap="round" opacity="0.78"/>
      <path d="M58 145 C136 122 238 128 330 145" fill="none" stroke="#cf4050" stroke-width="9" stroke-linecap="round" opacity="0.66"/>
      <path d="M58 145 C132 174 234 184 326 198" fill="none" stroke="#cf4050" stroke-width="9" stroke-linecap="round" opacity="0.54"/>
      <path d="M58 145 C118 226 224 242 318 244" fill="none" stroke="#cf4050" stroke-width="9" stroke-linecap="round" opacity="0.42"/>
      <circle cx="330" cy="58" r="10" fill="#2f91b8"/>
      <circle cx="334" cy="104" r="10" fill="#2f91b8" opacity="0.9"/>
      <circle cx="338" cy="145" r="10" fill="#2f91b8" opacity="0.78"/>
      <circle cx="334" cy="198" r="10" fill="#2f91b8" opacity="0.66"/>
      <circle cx="326" cy="244" r="10" fill="#2f91b8" opacity="0.54"/>
      <text x="0" y="320" fill="#151820" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="800">Example</text>
      <text x="0" y="355" fill="#30343b" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Communicate fire details</text>
      <text x="0" y="386" fill="#30343b" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">using two-way radios.</text>
    </g>

    <text x="30" y="548" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Read as a candidate map fix,</text>
    <text x="30" y="576" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">still requiring verification.</text>
  </g>

  <g transform="translate(970 168)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="610" rx="18" fill="#ffffff" stroke="#d8d2c7"/>
    <rect x="0" y="0" width="400" height="14" rx="7" fill="url(#review)"/>
    <text x="30" y="62" fill="#151820" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="850">Needs review</text>
    <text x="30" y="98" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="19">Coding or wording may drive the link.</text>

    <g transform="translate(36 138)">
      <circle cx="42" cy="145" r="13" fill="#806eb8"/>
      <path d="M58 145 C126 48 232 40 324 60" fill="none" stroke="#806eb8" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 13" opacity="0.86"/>
      <path d="M58 145 C137 82 237 82 326 104" fill="none" stroke="#806eb8" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 13" opacity="0.74"/>
      <path d="M58 145 C136 126 238 128 330 145" fill="none" stroke="#806eb8" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 13" opacity="0.62"/>
      <path d="M58 145 C132 174 234 184 326 198" fill="none" stroke="#806eb8" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 13" opacity="0.50"/>
      <path d="M58 145 C118 226 224 242 318 244" fill="none" stroke="#806eb8" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 13" opacity="0.38"/>
      <circle cx="330" cy="60" r="9" fill="#b59bd9"/>
      <circle cx="334" cy="104" r="9" fill="#b59bd9" opacity="0.9"/>
      <circle cx="338" cy="145" r="9" fill="#b59bd9" opacity="0.78"/>
      <circle cx="334" cy="198" r="9" fill="#b59bd9" opacity="0.66"/>
      <circle cx="326" cy="244" r="9" fill="#b59bd9" opacity="0.54"/>
      <rect x="142" y="96" width="78" height="78" rx="14" fill="#f6f1e8" stroke="#806eb8" stroke-width="3"/>
      <text x="166" y="151" fill="#806eb8" font-family="Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="850">?</text>
      <text x="0" y="320" fill="#151820" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="800">Example</text>
      <text x="0" y="355" fill="#30343b" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Plausible task match,</text>
      <text x="0" y="386" fill="#30343b" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">uncertain occupation code.</text>
    </g>

    <text x="30" y="548" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Read as evidence to inspect,</text>
    <text x="30" y="576" fill="#59606a" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">not a strong taxonomy claim.</text>
  </g>

  <text x="80" y="842" fill="#30343b" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="750">Keeping the lanes separate prevents every off-list pair from becoming the same kind of mismatch claim.</text>
</svg>
