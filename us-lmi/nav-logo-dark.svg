<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="250" height="32" viewBox="0 0 250 32">
  <g fill="#000000">
    <g transform="translate(2 2) scale(0.35) translate(-10 -10)">
      <!-- Handle pill (rotated filled rounded rect) -->
      <rect x="48.79" y="64.5" width="42.43" height="11" rx="5.5"
            fill="#000000" transform="rotate(45 70 70)"/>
      <!-- Lens ring: outer r=27.5, inner r=20.5, via even-odd -->
      <path d="M 38 10.5 A 27.5 27.5 0 1 1 38 65.5 A 27.5 27.5 0 1 1 38 10.5 Z
               M 38 17.5 A 20.5 20.5 0 1 0 38 58.5 A 20.5 20.5 0 1 0 38 17.5 Z"
            fill="#000000" fill-rule="evenodd"/>
      <!-- Briefcase handle (filled U-shape) -->
      <path d="M 32 34 V 29 Q 32 26 35 26 L 41 26 Q 44 26 44 29 V 34
               L 42 34 V 30 Q 42 28 40 28 L 36 28 Q 34 28 34 30 V 34 Z"
            fill="#000000"/>
      <!-- Briefcase body with clasp cutout (even-odd) -->
      <path d="M 28.5 34 L 47.5 34 Q 49 34 49 35.5 L 49 47.5
               Q 49 49 47.5 49 L 28.5 49 Q 27 49 27 47.5 L 27 35.5
               Q 27 34 28.5 34 Z
               M 34 40 L 42 40 L 42 42.5 L 34 42.5 Z"
            fill="#000000" fill-rule="evenodd"/>
    </g>
    <text x="38" y="15"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="700"
          font-size="14">JAAT</text>
    <text x="38" y="28"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="400"
          font-size="10">Job Ad Analysis Toolkit Dashboard</text>
  </g>
</svg>
