<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">Task 7219 occupation fan</title>
  <desc id="desc">O*NET task 7219 starts with Property, Real Estate, and Community Association Managers as its canonical home and fans to Real Estate Sales Agents as a posting-validated occupation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="canonical" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1f5a8a"/>
      <stop offset="1" stop-color="#4f8ec2"/>
    </linearGradient>
    <linearGradient id="posting" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1b7837"/>
      <stop offset="1" stop-color="#5dbb76"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="640" fill="#fbfaf7"/>
  <text x="72" y="64" fill="#111827" font-family="Arial, sans-serif" font-size="25" font-weight="700">One O*NET task, two occupation links</text>
  <text x="72" y="96" fill="#4b5563" font-family="Arial, sans-serif" font-size="16">Task 7219 shows how a posting-informed map can extend an official occupation-task assignment.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="370" height="190" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="96" y="244" fill="#111827" font-family="Arial, sans-serif" font-size="18" font-weight="700">Task 7219</text>
    <text x="96" y="276" fill="#374151" font-family="Arial, sans-serif" font-size="16">
      <tspan x="96" dy="0">Meet with prospective tenants</tspan>
      <tspan x="96" dy="24">to show properties, explain</tspan>
      <tspan x="96" dy="24">terms of occupancy, and</tspan>
      <tspan x="96" dy="24">provide local-area information.</tspan>
    </text>
  </g>

  <path d="M 440 285 C 560 220, 620 184, 735 176" fill="none" stroke="url(#canonical)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 440 318 C 560 398, 625 440, 735 456" fill="none" stroke="url(#posting)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="440" cy="300" r="12" fill="#111827"/>
  <circle cx="735" cy="176" r="10" fill="#1f5a8a" stroke="#0f172a" stroke-opacity="0.35"/>
  <circle cx="735" cy="456" r="10" fill="#1b7837" stroke="#0f172a" stroke-opacity="0.35"/>

  <g filter="url(#shadow)">
    <rect x="760" y="112" width="350" height="140" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="760" y="112" width="12" height="140" rx="6" fill="#1f5a8a"/>
    <text x="790" y="148" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".08em">O*NET CANONICAL HOME</text>
    <text x="790" y="181" fill="#111827" font-family="Arial, sans-serif" font-size="18" font-weight="700">
      <tspan x="790" dy="0">11-9141.00 Property, Real Estate,</tspan>
      <tspan x="790" dy="24">and Community Association Managers</tspan>
    </text>
    <text x="790" y="232" fill="#4b5563" font-family="Arial, sans-serif" font-size="14">Official occupation-task assignment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="392" width="350" height="140" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="760" y="392" width="12" height="140" rx="6" fill="#1b7837"/>
    <text x="790" y="428" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".08em">POSTING-VALIDATED ADDED LINK</text>
    <text x="790" y="461" fill="#111827" font-family="Arial, sans-serif" font-size="18" font-weight="700">
      <tspan x="790" dy="0">41-9022.00</tspan>
      <tspan x="790" dy="24">Real Estate Sales Agents</tspan>
    </text>
    <text x="790" y="512" fill="#4b5563" font-family="Arial, sans-serif" font-size="14">Two-model YES; NLx posting evidence</text>
  </g>

  <g transform="translate(72 548)">
    <rect x="0" y="0" width="1036" height="46" rx="12" fill="#f3f4f6" stroke="#e5e7eb"/>
    <circle cx="24" cy="23" r="7" fill="#1f5a8a"/>
    <text x="42" y="28" fill="#374151" font-family="Arial, sans-serif" font-size="14">official O*NET assignment</text>
    <circle cx="252" cy="23" r="7" fill="#1b7837"/>
    <text x="270" y="28" fill="#374151" font-family="Arial, sans-serif" font-size="14">reviewed posting-added pair</text>
    <text x="528" y="28" fill="#6b7280" font-family="Arial, sans-serif" font-size="14">The dashboard keeps both links visible rather than replacing one map with another.</text>
  </g>
</svg>
